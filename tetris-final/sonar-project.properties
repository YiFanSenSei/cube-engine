# SonarQube 项目配置
# SonarQube 运行在 VM 上，CI 通过 localhost:9000 连接
sonar.projectKey=tetris
sonar.projectName=Cube Engine - DevOps
sonar.projectVersion=1.0

# 源码路径
sonar.sources=native,back_end,tests

# 编码
sonar.sourceEncoding=UTF-8

# 排除第三方库
sonar.exclusions=**/crow.h,**/node_modules/**,**/build/**,**/*.pb.*

# C++ 文件后缀（激活 cxx 插件必需）
sonar.cxx.file.suffixes=.cpp,.h,.hpp

# Cppcheck 报告路径（CI 中会先生成）
sonar.cxx.cppcheck.reportPaths=cppcheck-report.xml

# SonarQube 服务器地址（VM 本地）
sonar.host.url=http://localhost:9000

# 认证 token
sonar.login=squ_cbfc386baaf7787b9ac2e610e5787d4872408691
